.execution-pill .chat-mascot .cat-tail {transform:var(--cap-tail);}
.execution-pill .chat-mascot .cat-paw-ground {display:none;}
.execution-pill .gesture-capsule-think {--cap-head:rotate(-14deg);--cap-left:translate(4px,-9px) rotate(20deg);}
.execution-pill .gesture-capsule-wave {--cap-head:rotate(8deg);--cap-right:translate(1px,-11px) rotate(-28deg);}
.execution-pill .gesture-capsule-notebook {--cap-head:translate(0,2px) rotate(12deg);--cap-left:translate(4px,-4px);--cap-right:translate(-3px,-3px);}
.execution-pill .gesture-capsule-inspect {--cap-head:translate(-2px,1px) rotate(-17deg);--cap-left:translate(-1px,-6px) rotate(-25deg);--cap-tail:rotate(35deg);}
.execution-pill .gesture-capsule-key {--cap-head:rotate(-7deg);--cap-right:translate(3px,-7px) rotate(-35deg);--cap-left:translateY(-2px);}
.execution-pill .gesture-capsule-chart {--cap-head:translateY(-2px);--cap-left:translate(-2px,-6px) rotate(-18deg);--cap-right:translate(2px,-6px) rotate(18deg);}
.execution-pill .gesture-capsule-coin {--cap-head:rotate(13deg);--cap-body:scale(1.1,.85);--cap-left:translate(3px,-2px);--cap-right:translate(-3px,-2px);}
.execution-pill .gesture-capsule-search {--cap-head:translate(2px,-1px) rotate(16deg);--cap-right:translate(-2px,-10px) rotate(-20deg);--cap-tail:rotate(30deg);}
.execution-pill .gesture-capsule-read {--cap-head:translate(0,3px) rotate(-8deg);--cap-body:scale(1.08,.88);--cap-left:translate(2px,-4px) rotate(10deg);--cap-right:translate(-2px,-4px) rotate(-10deg);}
.execution-pill .gesture-capsule-type {--cap-head:translate(0,1px);--cap-left:translate(2px,-5px) rotate(20deg);--cap-right:translate(-2px,-3px) rotate(-20deg);}
.execution-pill .gesture-capsule-reach {--cap-head:translateY(-2px) rotate(-12deg);--cap-body:scale(.9,1.15);--cap-left:translate(0,-13px) rotate(30deg);--cap-right:translate(0,-10px) rotate(-30deg);}
.execution-pill .gesture-capsule-list {--cap-head:rotate(12deg);--cap-right:translate(2px,-4px) rotate(-55deg);}
.execution-pill .gesture-capsule-pack {--cap-head:translate(0,3px);--cap-body:scale(1.12,.8);--cap-left:translate(3px,-4px);--cap-right:translate(-3px,-4px);--cap-tail:rotate(-35deg);}
.execution-pill :is(.gesture-capsule-think,.gesture-capsule-inspect,.gesture-capsule-search,.gesture-capsule-read) .cat-happy-eyes {display:none;}
.execution-pill :is(.gesture-capsule-think,.gesture-capsule-inspect,.gesture-capsule-search,.gesture-capsule-read) .cat-eyes {display:block;}
.execution-pill .chat-mascot>.capsule-accessory {position:absolute;z-index:2;right:-3px;bottom:-1px;width:12px;height:12px;color:var(--accent);overflow:visible;filter:drop-shadow(0 1px 0 var(--surface));}
.execution-pill .chat-mascot>.accessory-think,.execution-pill .chat-mascot>.accessory-wave {top:-1px;bottom:auto;width:9px;height:9px;color:var(--token-output);}
.execution-pill .chat-mascot>.accessory-coin,.execution-pill .chat-mascot>.accessory-key {color:var(--orange);}
.execution-pill .chat-mascot>.accessory-inspect {color:var(--orange);}
.execution-step.is-running .chat-mascot .cat-cranium {animation:capsule-head-work 2s ease-in-out infinite;}
.execution-step.is-running .chat-mascot .cat-paw-right {animation:capsule-paw-work .9s ease-in-out infinite;}
@keyframes capsule-head-work {0%,100%{transform:var(--cap-head)}50%{transform:var(--cap-head) translateY(-1px)}}
@keyframes capsule-paw-work {0%,100%{transform:var(--cap-right)}50%{transform:var(--cap-right) translateY(-2px)}}

/* 边界局部坐标：y=0 就是输入框外沿，身体只在 y<0 可见，爪尖覆盖边线 3px。 */
.lele-companion-marker {position:absolute;width:0;height:0;pointer-events:none;}
.lele-perch-anchor {position:absolute;width:58px;height:0;z-index:4;pointer-events:auto;transform-origin:29px 0;cursor:default;}
.lele-perch-anchor.at-top {top:0;}
.lele-perch-anchor.at-left {left:0;width:0;height:58px;transform:none;}
.lele-perch-anchor.at-right {right:0;width:0;height:58px;transform:scaleX(-1);transform-origin:0 50%;}
.lele-perch-anchor.at-bottom {bottom:0;}
.lele-perch-anchor.is-questioning {transition:left .78s cubic-bezier(.22,.8,.28,1);}
.lele-edge-viewport {position:absolute;bottom:0;left:-12px;width:82px;height:68px;overflow:clip;contain:paint;}
.lele-edge-actor {position:absolute;left:12px;bottom:-21px;width:58px;height:58px;transform-origin:50% 64%;--rest-y:0px;--rest-angle:0deg;--rest-sx:1;--rest-sy:1;transform:translateY(var(--rest-y)) rotate(var(--rest-angle)) scale(var(--rest-sx),var(--rest-sy));}
.lele-edge-actor>.chat-mascot {width:58px;height:58px;animation:none!important;transform:none;}
.lele-edge-actor>.chat-mascot>svg {clip-path:none;}
.lele-edge-grip {position:absolute;left:14px;right:12px;top:-3px;display:flex;justify-content:space-between;transform-origin:50% 0;}
.lele-edge-grip i {width:9px;height:6px;box-sizing:border-box;border:1.5px solid #62676e;background:#f4f5f6;border-radius:3px 3px 4px 4px;box-shadow:inset 2px -1px #dfe2e5;transform-origin:50% 80%;}
.lele-perch-anchor.phase-enter .lele-edge-grip {animation:lele-grip-arrive .62s cubic-bezier(.22,1.25,.4,1) both;}
.lele-perch-anchor.phase-exit .lele-edge-grip {animation:lele-grip-release .26s ease-in both;}
.lele-perch-anchor.phase-enter .lele-edge-actor {animation:lele-climb-in .8s cubic-bezier(.18,.72,.3,1) both;}
.lele-perch-anchor.phase-exit .lele-edge-actor {animation:lele-duck-out .26s cubic-bezier(.55,0,.85,.4) both;}
.lele-perch-anchor.pose-peek .lele-edge-actor {--rest-y:9px;}
.lele-perch-anchor.pose-peek.phase-enter .lele-edge-actor,.lele-perch-anchor.pose-shy.phase-enter .lele-edge-actor {animation:lele-peek-in 1.25s cubic-bezier(.16,.7,.24,1) both;}
.lele-perch-anchor.pose-paws .lele-edge-actor {--rest-y:42px;}
.lele-perch-anchor.pose-paws.phase-enter .lele-edge-grip {animation:lele-paws-hello 1.4s ease both;}
.lele-perch-anchor.pose-wave.phase-enter .lele-edge-actor {animation:lele-wave-in .7s cubic-bezier(.18,.8,.32,1) both;}
.lele-perch-anchor.pose-wave.phase-exit .lele-edge-actor,.lele-perch-anchor.pose-wink.phase-exit .lele-edge-actor {animation:lele-dash-out .24s cubic-bezier(.55,0,.85,.4) both;}
.lele-perch-anchor.pose-wave .lele-edge-grip i:first-child {animation:lele-grip-wave 2.8s .8s infinite;}
.lele-perch-anchor.pose-sleep .lele-edge-actor,.lele-perch-anchor.pose-curl .lele-edge-actor {--rest-y:8px;--rest-angle:-9deg;--rest-sx:1.08;--rest-sy:.87;}
.lele-perch-anchor.pose-sleep.phase-enter .lele-edge-actor,.lele-perch-anchor.pose-curl.phase-enter .lele-edge-actor {animation:lele-settle-in 1.7s cubic-bezier(.2,.7,.4,1) both;}
.lele-perch-anchor.pose-sleep.phase-exit .lele-edge-actor,.lele-perch-anchor.pose-curl.phase-exit .lele-edge-actor {animation:lele-roll-out .28s ease-in both;}
.lele-perch-anchor.pose-stretch .lele-edge-actor {--rest-y:-2px;--rest-sy:1.06;}
.lele-perch-anchor.pose-stretch.phase-enter .lele-edge-actor {animation:lele-stretch-in 1.25s ease both;}
.lele-perch-anchor.pose-look .cat-cranium {animation:lele-face-look 4.2s ease-in-out infinite;}
.lele-perch-anchor.pose-curl .cat-eyes {display:none;}.lele-perch-anchor.pose-curl .cat-sleep-eyes {display:block;}
.lele-perch-anchor .chat-mascot.gesture-sleep .lele-sleep {top:0;right:0;animation:lele-dream 3s ease-in-out infinite;}
.lele-perch-anchor .lele-sleep span {transform:translateY(-4px);}.lele-perch-anchor .lele-sleep b {transform:translateY(-8px);}
.lele-perch-anchor .chat-mascot.gesture-wink .cat-eyes {animation:cat-blink 3s infinite;}

/* 等询问时会抬眼、侧耳、举爪、轻轻探头；头和脸一起转，爪子仍握住实体边。 */
.lele-question-mark {position:absolute;right:0;top:-3px;color:var(--accent);font-size:14px;font-weight:650;transform:rotate(12deg);animation:lele-question-bob 3s ease-in-out infinite;}
.lele-perch-anchor.pose-curious .lele-edge-actor {--rest-angle:-5deg;--rest-y:0px;}
.lele-perch-anchor.pose-listen .lele-edge-actor {--rest-angle:8deg;--rest-y:4px;}
.lele-perch-anchor.pose-invite .lele-edge-actor {--rest-y:-1px;}
.lele-perch-anchor.pose-invite .lele-edge-grip i:last-child {animation:lele-invite-paw 3.5s .8s infinite;}
.lele-perch-anchor.pose-shy .lele-edge-actor {--rest-y:8px;--rest-angle:-3deg;}
.lele-perch-anchor.is-questioning .lele-edge-actor {transition:transform .78s cubic-bezier(.22,.8,.28,1);}

/* 乐乐不是一个循环图标：不同动作有不同的重心、进入方向和离场速度。 */
.lele-perch-anchor.pose-pop .lele-edge-viewport,.lele-perch-anchor.pose-walk .lele-edge-viewport,.lele-perch-anchor.pose-tumble .lele-edge-viewport,.lele-perch-anchor.pose-belly .lele-edge-viewport,.lele-perch-anchor.pose-toy .lele-edge-viewport {height:84px;bottom:0;}
.lele-perch-anchor.pose-pop.phase-enter .lele-edge-actor {animation:lele-pop-in .72s cubic-bezier(.16,1.55,.28,1) both;}
.lele-perch-anchor.pose-walk.phase-enter .lele-edge-actor {animation:lele-walk-in 1.65s cubic-bezier(.18,.8,.25,1) both;}
.lele-perch-anchor.pose-walk.phase-rest .lele-edge-actor {animation:lele-walk-step 1.8s ease-in-out infinite;}
.lele-perch-anchor.pose-tumble.phase-enter .lele-edge-actor {animation:lele-tumble-in .92s cubic-bezier(.28,1.4,.35,1) both;}
.lele-perch-anchor.pose-belly .lele-edge-actor {--rest-y:5px;--rest-angle:180deg;--rest-sy:.88;}
.lele-perch-anchor.pose-belly.phase-enter .lele-edge-actor {animation:lele-belly-flop 1.1s cubic-bezier(.2,1.3,.4,1) both;}
.lele-perch-anchor.pose-toy .lele-edge-actor {--rest-y:3px;}
.lele-perch-anchor.pose-toy.phase-enter .lele-edge-actor {animation:lele-toy-pounce .95s cubic-bezier(.2,1.4,.4,1) both;}
.lele-perch-anchor.pose-toy .cat-paws {animation:lele-paw-bat .8s ease-in-out infinite alternate;transform-origin:16px 24px;}
.lele-perch-anchor.pose-cute .lele-edge-actor {--rest-angle:-7deg;--rest-y:1px;}
.lele-perch-anchor.pose-cute.phase-enter .lele-edge-actor {animation:lele-cute-bounce 1s cubic-bezier(.2,1.4,.35,1) both;}
.lele-perch-anchor.pose-cute .cat-eyes {display:none;}.lele-perch-anchor.pose-cute .cat-happy-eyes {display:block;animation:lele-cute-blink 3.2s infinite;}
.lele-perch-anchor.pose-lick .lele-edge-actor {--rest-angle:6deg;--rest-y:2px;}
.lele-perch-anchor.pose-lick .cat-paws {animation:lele-lick-paw .9s ease-in-out infinite alternate;transform-origin:14px 24px;}
.lele-perch-anchor.pose-lick .cat-nose-mouth {animation:lele-lick-face .9s ease-in-out infinite alternate;transform-origin:16px 16px;}
.lele-perch-anchor.pose-chase .cat-tail {animation:lele-tail-chase .48s linear infinite;}
.lele-perch-anchor.pose-groom .cat-cranium,.lele-perch-anchor.pose-wash .cat-cranium {animation:lele-groom-face 1.8s ease-in-out infinite;transform-origin:16px 16px;}
.lele-perch-anchor.pose-groom .cat-paws,.lele-perch-anchor.pose-wash .cat-paws {animation:lele-wash-paws 1.15s ease-in-out infinite alternate;transform-origin:16px 25px;}
.lele-perch-anchor.pose-knead .lele-edge-grip i {animation:lele-knead .7s ease-in-out infinite alternate;}
.lele-perch-anchor.pose-shake .lele-edge-actor {animation:lele-shake .75s ease-in-out infinite;}
.lele-perch-anchor.pose-zzz .lele-edge-actor {--rest-y:19px;opacity:.25;}
.lele-perch-anchor.pose-zzz .lele-sleep {display:flex!important;position:absolute;top:-13px;right:-12px;gap:3px;color:var(--ink-3);font-size:10px;animation:lele-dream 2.5s ease-in-out infinite;}
.lele-perch-anchor.pose-drop.phase-enter .lele-edge-actor {animation:lele-drop-in .9s cubic-bezier(.2,1.5,.35,1) both;}
.lele-perch-anchor.pose-annoyed .lele-edge-actor {--rest-angle:-9deg;--rest-y:-3px;}
.lele-perch-anchor.pose-annoyed.phase-enter .lele-edge-actor {animation:lele-annoyed-hop .7s cubic-bezier(.2,1.4,.35,1) both;}
.lele-perch-anchor.pose-proud .lele-edge-actor {animation:lele-proud .9s ease both;}
.lele-perch-anchor.pose-spin .lele-edge-actor {animation:lele-spin .9s cubic-bezier(.2,.8,.35,1) both;}
.chat-mascot.gesture-annoyed .cat-cranium {animation:lele-annoyed-face .7s ease-in-out infinite alternate;}
.chat-mascot.gesture-zzz .cat-eyes,.chat-mascot.gesture-zzz .cat-happy-eyes {display:none;}
.chat-mascot.gesture-zzz .cat-sleep-eyes {display:block;}
.chat-mascot.gesture-zzz .lele-sleep {display:flex;position:absolute;top:-10px;right:-14px;gap:3px;color:var(--ink-3);font-size:9px;}
.chat-mascot.gesture-proud .cat-happy-eyes {display:block;}.chat-mascot.gesture-proud .cat-eyes {display:none;}
.lele-heart,.lele-toy,.lele-exclaim {position:absolute;z-index:3;font-weight:700;pointer-events:none;}
.lele-heart {right:-7px;top:-9px;color:var(--red);font-size:11px;animation:lele-heart-pop 1.2s ease both;}
.lele-toy {left:-8px;top:-4px;color:var(--accent);font-size:13px;animation:lele-toy-float .8s ease-in-out infinite alternate;}
.lele-exclaim {right:-5px;top:-10px;color:var(--orange);font-size:14px;}

/* 仅给原有像素分组加骨骼变换，不增画眉毛、眼睛或改变毛色轮廓。 */
.lele-perch-anchor.at-menu {z-index:30;}
.lele-edge-viewport {pointer-events:none;}
.lele-edge-actor {pointer-events:auto;}
.lele-perch-anchor.phase-hidden .lele-edge-actor {transform:translateY(90px);animation:none;pointer-events:none;}
.lele-perch-anchor.phase-hidden .lele-edge-grip {visibility:hidden;}
.lele-perch-anchor:is(.pose-pop,.pose-walk,.pose-tumble,.pose-toy,.pose-cute,.pose-proud,.pose-spin,.pose-stretch,.pose-chase,.pose-groom,.pose-wash,.pose-lick) .lele-edge-actor {--rest-y:-16px;}
.lele-perch-anchor.pose-walk .lele-edge-viewport {left:-52px;width:162px;}
.lele-perch-anchor.pose-walk .lele-edge-actor {left:52px;}
.lele-perch-anchor.pose-walk.phase-rest .lele-edge-actor {animation:lele-two-steps 3s ease-in-out both;}
.lele-perch-anchor:is(.pose-pop,.pose-walk,.pose-tumble).phase-exit .lele-edge-actor {animation:lele-jump-away .3s cubic-bezier(.6,0,.9,.5) both;}
.lele-perch-anchor.pose-zzz .lele-edge-actor {--rest-y:0px;opacity:1;}
.lele-perch-anchor.pose-zzz .chat-mascot>svg {visibility:hidden;}
.lele-perch-anchor.pose-zzz .lele-sleep {top:0;right:8px;}
.lele-perch-anchor:is(.pose-sleep,.pose-curl) .lele-edge-actor {--rest-y:-8px;--rest-angle:72deg;--rest-sx:.95;--rest-sy:.9;transform-origin:50% 50%;}
.lele-perch-anchor.pose-curl .cat-tail {transform:rotate(-70deg) translate(-3px,-1px);animation:none;}
.lele-perch-anchor.pose-sleep .cat-cranium {transform:rotate(-7deg);transform-origin:16px 19px;}
.lele-perch-anchor:is(.pose-sleep,.pose-curl) .cat-body {animation:lele-sleep-breath 3.6s ease-in-out infinite;transform-origin:16px 24px;}
.lele-perch-anchor.pose-belly .lele-edge-actor {--rest-y:-11px;--rest-angle:105deg;--rest-sy:1;transform-origin:50% 50%;}
.lele-perch-anchor.pose-belly .cat-paws {animation:lele-belly-paws 1.5s ease-in-out infinite;transform-origin:16px 26px;}
.lele-perch-anchor.pose-chase .lele-edge-actor {animation:lele-chase-turn 3s ease-in-out infinite;}
.lele-perch-anchor.pose-stretch.phase-rest .cat-body {animation:lele-long-stretch 5s ease-in-out infinite;transform-origin:16px 29px;}
.lele-perch-anchor:is(.pose-wash,.pose-groom,.pose-lick) .cat-paws {animation:none;}
.lele-perch-anchor.pose-lick .cat-paw-left {animation:lele-paw-to-mouth 1.2s ease-in-out infinite;transform-origin:11px 26px;}
.lele-perch-anchor.pose-wash .cat-paw-right {animation:lele-face-wash 1.8s ease-in-out infinite;transform-origin:21px 26px;}
.lele-perch-anchor.pose-wash .cat-paw-right .cat-paw-ground,.lele-perch-anchor.pose-lick .cat-paw-left .cat-paw-ground {display:none;}
.lele-perch-anchor.pose-groom .cat-cranium {animation:lele-groom-body 2.4s ease-in-out infinite;transform-origin:16px 19px;}
.lele-perch-anchor.pose-toy .cat-paws {animation:none;}
.lele-perch-anchor.pose-toy .cat-paw-right {animation:lele-paw-bat .8s ease-in-out infinite alternate;transform-origin:21px 25px;}
.lele-toy {width:10px;height:10px;top:37px;left:47px;border:1px solid var(--accent);border-radius:50%;background:repeating-linear-gradient(35deg,var(--accent-tint) 0 2px,var(--accent) 3px 4px);}
.lele-perch-anchor.pose-knead .lele-edge-grip i:last-child {animation-delay:-.7s;}
.lele-perch-anchor.pose-drop .lele-edge-viewport {height:calc(80px - var(--fall-from,-48px));}
.lele-perch-anchor.pose-drop.phase-enter .lele-edge-actor {animation:lele-fall-from-menu .8s cubic-bezier(.3,.1,.75,1) both;}
.lele-perch-anchor.pose-transfer.phase-enter .lele-edge-viewport {overflow:visible;contain:none;}
.lele-perch-anchor.pose-transfer.phase-enter .lele-edge-actor {animation:lele-menu-transfer .7s cubic-bezier(.3,.1,.6,1) both;}
@keyframes lele-menu-transfer {0%{transform:translate(var(--travel-x),var(--travel-y)) rotate(-8deg)}42%{transform:translate(calc(var(--travel-x) * .5),var(--travel-arc)) rotate(10deg)}82%{transform:translate(0,3px) scale(1.06,.92)}100%{transform:none}}
.lele-perch-anchor.is-questioning .lele-edge-actor {animation:none!important;transition:none!important;transform:translateY(var(--rest-y)) rotate(var(--rest-angle)) scale(var(--rest-sx),var(--rest-sy));}
.lele-perch-anchor.is-questioning .chat-mascot *,.lele-perch-anchor.is-questioning .lele-edge-grip,.lele-perch-anchor.is-questioning .lele-edge-grip i {animation:none!important;transition:none!important;}
@keyframes lele-two-steps {0%,15%{transform:translate(0,-16px)}32%{transform:translate(10px,-19px) rotate(4deg)}48%{transform:translate(18px,-16px)}64%{transform:translate(28px,-19px) rotate(-4deg)}80%,100%{transform:translate(35px,-16px)}}
@keyframes lele-jump-away {0%{transform:translateY(-16px)}25%{transform:translate(5px,-24px) rotate(10deg)}100%{transform:translate(23px,70px) rotate(28deg)}}
@keyframes lele-sleep-breath {50%{transform:scale(1.04,1.03)}}
@keyframes lele-belly-paws {50%{transform:translateY(-2px) scaleX(.85)}}
@keyframes lele-chase-turn {0%,100%{transform:translateY(-16px) rotate(0)}30%{transform:translateY(-20px) rotate(110deg)}65%{transform:translateY(-20px) rotate(330deg)}}
@keyframes lele-long-stretch {0%,80%,100%{transform:none}40%,60%{transform:scale(.93,1.23)}}
@keyframes lele-paw-to-mouth {0%,100%{transform:none}30%,75%{transform:translate(3px,-9px) rotate(25deg)}45%,60%{transform:translate(4px,-10px) rotate(18deg)}}
@keyframes lele-face-wash {0%,100%{transform:none}25%,65%{transform:translate(-2px,-14px) rotate(-25deg)}45%,80%{transform:translate(-4px,-9px) rotate(-10deg)}}
@keyframes lele-groom-body {0%,100%{transform:none}25%,70%{transform:translate(3px,4px) rotate(18deg)}45%,90%{transform:translate(2px,3px) rotate(10deg)}}
@keyframes lele-fall-from-menu {0%{transform:translateY(var(--fall-from,-48px)) rotate(-8deg)}78%{transform:translateY(-4px) rotate(10deg)}89%{transform:translateY(4px) scale(1.1,.85)}100%{transform:none}}

/* 气泡用同一条曲线跟随头顶，尾巴是曲线而不是箭头；展开与收起均以尾尖为原点。 */
.lele-speech {position:absolute;z-index:8;box-sizing:border-box;margin:0;padding:0;border:0;display:block;color:var(--ink-2);font-size:12px;transform-origin:var(--speech-tail) calc(100% + 22px);transition:left .78s cubic-bezier(.22,.8,.28,1),bottom .78s cubic-bezier(.22,.8,.28,1);animation:lele-speech-open .62s cubic-bezier(.16,.85,.3,1.12) both;}
.lele-speech-card {display:flex;flex-direction:column;max-height:var(--speech-height);box-sizing:border-box;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));border-radius:22px;box-shadow:0 12px 42px color-mix(in srgb,var(--ink) 11%,transparent),0 2px 6px color-mix(in srgb,var(--ink) 3%,transparent);overflow:hidden;}
.lele-speech-heading {padding:17px 20px 12px;flex-shrink:0;}
.lele-speech-heading>span {font-size:10px;letter-spacing:.06em;color:var(--ink-3);}
.lele-speech-heading h3 {font-size:15px;font-weight:600;line-height:1.65;color:var(--ink);margin:5px 0 0;overflow-wrap:anywhere;}
.lele-speech-content {padding:0 20px;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;}
.lele-operation {display:flex;align-items:center;gap:7px;margin:2px 0 6px;color:var(--ink);font-size:12px;}
.lele-operation-dot {width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent);flex-shrink:0;}
.lele-operation-description {margin:0 0 12px;color:var(--ink-2);font-size:12px;line-height:1.8;overflow-wrap:anywhere;}
.lele-operation-fields {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;border:1px solid var(--line);background:color-mix(in srgb,var(--inset) 70%,var(--surface));border-radius:12px;padding:12px 14px;margin:0 0 10px;}
.lele-operation-fields>div {min-width:0;}.lele-operation-fields>.is-wide {grid-column:1 / -1;}
.lele-operation-fields dt {color:var(--ink-3);font-size:10px;line-height:1.6;margin-bottom:3px;}
.lele-operation-fields dd {margin:0;color:var(--ink);font-size:12px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;}
.lele-operation-scope {margin:8px 0 0;color:var(--ink-3);font-size:10px;line-height:1.7;overflow-wrap:anywhere;}
.lele-speech .tool-approval-actions {display:flex;flex-shrink:0;justify-content:flex-end;gap:9px;padding:13px 18px 16px;margin:0;}
.lele-speech .ant-btn {margin:0;border-radius:10px;font-size:12px;box-shadow:none;}
.lele-speech .ant-btn-default {border-color:transparent;background:transparent;color:var(--ink-2);}
.lele-approval-error {color:var(--orange);margin:8px 0 0;font-size:12px;overflow-wrap:anywhere;}
.lele-speech-tail {position:absolute;left:calc(var(--speech-tail) - 22px);top:calc(100% - 1px);overflow:visible;transition:left .78s cubic-bezier(.22,.8,.28,1);pointer-events:none;}
.lele-speech-tail path {fill:var(--surface);stroke:color-mix(in srgb,var(--accent) 25%,var(--line));stroke-width:1px;}
.lele-speech.is-closing {animation:lele-speech-close .25s cubic-bezier(.55,0,.75,.35) both;pointer-events:none;}

/* 从框后侧头探出：头颈向外倾，耳朵先露、再露完整脸部，右侧镜像。 */
.lele-perch-anchor.is-fragment .lele-edge-actor {--rest-y:0px;--rest-angle:0deg;transform:none;}
.lele-perch-anchor.is-fragment .cat-shadow,.lele-perch-anchor.is-fragment .cat-body,.lele-perch-anchor.is-fragment .lele-sparks {display:none;}
.lele-perch-anchor:is(.at-left,.at-right) .lele-edge-viewport {left:-48px;top:0;bottom:auto;width:48px;height:58px;}
.lele-perch-anchor:is(.at-left,.at-right) .lele-edge-actor {left:48px;top:0;bottom:auto;}
.lele-perch-anchor:is(.at-left,.at-right) :is(.cat-paws,.cat-tail) {display:none;}
.lele-perch-anchor:is(.pose-side-peek,.pose-side-scout) .lele-edge-actor {transform:translateX(-44px);}
.lele-perch-anchor:is(.pose-side-peek,.pose-side-scout) .cat-body {display:block;transform:translate(17px,-1px);animation:none;}
.lele-perch-anchor:is(.pose-side-peek,.pose-side-scout) .cat-cranium {transform:translate(-1px,7px) rotate(-32deg) scale(.87);transform-origin:23px 19px;}
.lele-perch-anchor.pose-side-peek .cat-cranium {animation:lele-peek-tilt 4.6s ease-in-out both;}
.lele-perch-anchor.pose-side-peek.phase-enter .lele-edge-actor {animation:lele-side-peek 4.6s ease-in-out both;}
.lele-perch-anchor.pose-side-scout.phase-enter .lele-edge-actor {animation:lele-side-scout 5.4s ease-in-out both;}
.lele-perch-anchor.pose-side-scout .cat-cranium {animation:lele-side-listen 5.4s ease-in-out both;transform-origin:16px 19px;}
.lele-perch-anchor:is(.pose-side-peek,.pose-side-scout).phase-exit .lele-edge-actor {animation:lele-side-retreat .24s cubic-bezier(.5,0,.9,.3) both;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap) .cat-cranium {display:none;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap) .cat-paws {display:block;animation:none;transform:translate(-5px,-1px) rotate(90deg);transform-origin:21px 26px;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap) .cat-paw-left,.lele-perch-anchor.is-fragment .cat-paws>rect {display:none;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap) .cat-paw-ground {display:none;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap) .lele-edge-actor {transform:translateX(-42px);}
.lele-perch-anchor.pose-side-paw.phase-enter .lele-edge-actor {animation:lele-side-paw 4.3s ease-in-out both;}
.lele-perch-anchor.pose-side-tap.phase-enter .lele-edge-actor {animation:lele-side-tap 3.8s ease-in-out both;}
.lele-perch-anchor:is(.pose-side-paw,.pose-side-tap).phase-exit .lele-edge-actor {animation:lele-paw-retreat .22s ease-in both;}

/* 下沿保持正立的局部骨骼：尾巴不慎漏出、后腿滑下再蹬回去，头和肚皮都在框后。 */
.lele-perch-anchor.at-bottom .lele-edge-viewport {top:0;bottom:auto;left:-4px;width:66px;height:42px;}
.lele-perch-anchor.at-bottom .lele-edge-actor {left:4px;top:-43px;bottom:auto;}
.lele-perch-anchor.at-bottom .cat-cranium {display:none;}
.lele-perch-anchor.at-bottom .cat-tail {transform-origin:27px 22px;transform:translateX(-12px) scale(1.25,2.25);animation:none;}
.lele-perch-anchor:is(.pose-tail-slip,.pose-tail-tip) .cat-paws {display:none;}
.lele-perch-anchor.pose-tail-slip.phase-enter .lele-edge-actor {animation:lele-tail-slip 4.7s ease-in-out both;}
.lele-perch-anchor.pose-tail-tip.phase-enter .lele-edge-actor {animation:lele-tail-tip 3.8s ease-in-out both;}
.lele-perch-anchor.pose-tail-slip .cat-tail {animation:lele-tail-fidget 4.7s ease-in-out both;}
.lele-perch-anchor.pose-tail-tip .cat-tail {animation:lele-tail-fidget 3.8s ease-in-out both;}
.lele-perch-anchor:is(.pose-tail-slip,.pose-tail-tip).phase-exit .lele-edge-actor {animation:lele-bottom-retreat .2s cubic-bezier(.6,0,.9,.4) both;}
.lele-perch-anchor:is(.pose-feet-kick,.pose-foot-dangle) .cat-tail {display:none;}
.lele-perch-anchor:is(.pose-feet-kick,.pose-foot-dangle) .cat-paws {animation:none;}
.lele-perch-anchor:is(.pose-feet-kick,.pose-foot-dangle) .cat-paw-ground {display:none;}
.lele-perch-anchor.pose-foot-dangle .cat-paw-left {display:none;}
.lele-perch-anchor.pose-feet-kick.phase-enter .lele-edge-actor {animation:lele-feet-recover 5.6s ease-in-out both;}
.lele-perch-anchor.pose-foot-dangle.phase-enter .lele-edge-actor {animation:lele-foot-slip 4.8s ease-in-out both;}
.lele-perch-anchor.pose-feet-kick .cat-paw-left {animation:lele-left-kick 5.6s ease-in-out both;transform-origin:11px 17px;}
.lele-perch-anchor.pose-feet-kick .cat-paw-right {animation:lele-right-kick 5.6s ease-in-out both;transform-origin:21px 17px;}
.lele-perch-anchor.pose-foot-dangle .cat-paw-right {animation:lele-lonely-kick 4.8s ease-in-out both;transform-origin:21px 17px;}
.lele-perch-anchor:is(.pose-feet-kick,.pose-foot-dangle).phase-exit .lele-edge-actor {animation:lele-bottom-retreat .24s ease-in both;}
.lele-perch-anchor.is-fragment.phase-hidden .lele-edge-actor {visibility:hidden;animation:none;pointer-events:none;}

/* 112 / 64 = 1.75；SVG y=28 与边沿重合，余下 26 行是悬在前面的腿和尾巴。 */
.lele-perch-anchor.pose-drape {z-index:4;}
.pose-drape .lele-edge-viewport {left:-27px;bottom:-45.5px;width:112px;height:158px;overflow:visible;contain:none;clip-path:inset(-140px -100px 0px -100px);}
.pose-drape .lele-edge-actor {left:0;bottom:0;width:112px;height:94.5px;transform:none;--rest-y:0px;--rest-angle:0deg;transform-origin:50% 49px;pointer-events:none;}
.pose-drape :is(.cat-cranium,.lounge-body) {pointer-events:visiblePainted;}
.pose-drape .lele-edge-actor>.chat-mascot {width:112px;height:94.5px;}
.pose-drape .chat-mascot>svg {width:112px;height:94.5px;overflow:visible;}
.pose-drape :is(.cat-tail,.cat-body,.cat-paws,.cat-shadow,.lele-sparks,.lele-sleep,.cat-happy-eyes) {display:none!important;}
.pose-drape .cat-cranium {transform:translate(0px,8px) rotate(-7deg);transform-origin:16px 19px;animation:none;}
.pose-drape .cat-eyes {display:none;animation:none;transform-origin:center;}
.pose-drape .cat-sleep-eyes {display:block;}
.pose-drape .lounge-body {transform-origin:35px 28px;animation:lele-drape-breathe 4.8s ease-in-out infinite;}
.pose-drape .lounge-tail {transform-origin:48px 22px;animation:lele-drape-tail 6s ease-in-out infinite;}
.pose-drape .lounge-hanging-leg {transform-origin:var(--joint-x) var(--joint-y);}
.pose-drape .lounge-front-leg {animation:lele-drape-paw 5.7s ease-in-out infinite;}
.pose-drape .lounge-hind-leg {animation:lele-drape-paw 6.5s -2s ease-in-out infinite reverse;}
.pose-drape .lounge-wrist {transform-origin:25px 30px;}
.pose-drape .lounge-hock {transform-origin:44px 33px;}
.pose-drape .lounge-folded-paw {transform-origin:30px 24px;}
.pose-drape.phase-enter .lele-edge-actor {animation:lele-drape-arrive 1.9s ease-in-out both;}
.pose-drape.phase-enter .lele-edge-viewport {animation:lele-drape-uncover 1.9s steps(1) both;}
.pose-drape.phase-enter .cat-cranium {animation:lele-drape-settle-head 1.9s ease-in-out both;}
.pose-drape.phase-enter .lounge-hanging-leg {animation:lele-drape-unfold 1.9s ease-in-out both;}
.pose-drape.phase-enter .lounge-tail {animation:lele-drape-uncoil 1.9s ease-in-out both;}
.pose-drape.phase-startle .lele-edge-actor {animation:lele-drape-hop-hide 1.6s linear both;}
.pose-drape.phase-startle .lele-edge-viewport {animation:lele-drape-cover 1.6s steps(1) both;}
.pose-drape.phase-startle .cat-cranium {animation:lele-drape-startled-head 1.6s linear both;}
.pose-drape.phase-startle .cat-eyes {display:block;animation:lele-drape-wide-eyes 1.6s linear both;}
.pose-drape.phase-startle .cat-sleep-eyes {display:none;}
.pose-drape.phase-startle .lounge-body {animation:lele-drape-startled-body 1.6s linear both;}

// textarea 不提供文字矩形；用相同排版的不可见镜像测量，不能用字符数猜中文、换行和滚动位置。
function composerTextRects(textarea) {
  if (!textarea?.value) return [];
  const box = textarea.getBoundingClientRect(), css = getComputedStyle(textarea);
  const mirror = document.createElement("div");
  mirror.setAttribute("aria-hidden", "true");
  for (const key of ["boxSizing", "fontFamily", "fontSize", "fontWeight", "fontStyle", "fontVariant", "fontStretch", "lineHeight", "letterSpacing", "wordSpacing", "textIndent", "textAlign", "textTransform", "direction", "tabSize", "paddingTop", "paddingRight", "paddingBottom", "paddingLeft", "borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth", "wordBreak", "overflowWrap"]) mirror.style[key] = css[key];
  Object.assign(mirror.style, { position: "fixed", visibility: "hidden", pointerEvents: "none", margin: "0", left: `${box.left}px`, top: `${box.top - textarea.scrollTop}px`, width: `${box.width - (textarea.offsetWidth - textarea.clientWidth - parseFloat(css.borderLeftWidth) - parseFloat(css.borderRightWidth))}px`, height: "auto", borderStyle: "solid", whiteSpace: "pre-wrap" });
  mirror.textContent = textarea.value;
  document.body.appendChild(mirror);
  try {
    const range = document.createRange(); range.selectNodeContents(mirror);
    return [...range.getClientRects()].map(r => ({ left: Math.max(r.left - textarea.scrollLeft, box.left), right: Math.min(r.right - textarea.scrollLeft, box.right), top: Math.max(r.top, box.top), bottom: Math.min(r.bottom, box.bottom) })).filter(r => r.right > r.left && r.bottom > r.top);
  } finally { mirror.remove(); }
}

function textNearDrapedCat(textarea, anchor, clearance = 7, text = composerTextRects(textarea)) {
  if (!text.length || !anchor) return false;
  const edge = anchor.getBoundingClientRect().top;
  const viewport = anchor.querySelector(".lele-edge-viewport");
  const clip = getComputedStyle(viewport).clipPath.match(/^inset\(\S+\s+\S+\s+(-?[\d.]+)px/);
  const visibleBottom = viewport.getBoundingClientRect().bottom - Number(clip?.[1] || 0);
  return [...anchor.querySelectorAll("[data-drape-contact]")].some(part => {
    const r = part.getBoundingClientRect(), top = Math.max(edge, r.top), bottom = Math.min(r.bottom, visibleBottom);
    return bottom > top && text.some(t => t.right + clearance >= r.left && t.left - clearance <= r.right && t.bottom + clearance >= top && t.top - clearance <= bottom);
  });
}

const anchor=document.querySelector('.lele-perch-anchor'),input=document.querySelector('textarea'),status=document.querySelector('#status');let timer;
const labels={enter:'从框后上来，放松地趴下',rest:'安静趴睡',startle:'惊醒、收腿起跳、藏到框后',stretch:'起身伸懒腰、迈步、跳下',hidden:'已经藏到框后'};
function play(phase){clearTimeout(timer);anchor.classList.remove('phase-enter','phase-rest','phase-startle','phase-stretch','phase-hidden');void anchor.offsetWidth;anchor.classList.add('phase-'+phase);status.textContent=labels[phase];if(phase==='enter')timer=setTimeout(()=>play('rest'),1950);if(['startle','stretch'].includes(phase))timer=setTimeout(()=>play('hidden'),phase==='startle'?1650:3450);}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{input.value='';play(b.dataset.phase);});
input.addEventListener('input',()=>{if(anchor.classList.contains('phase-rest')&&textNearDrapedCat(input,anchor))play('startle');});
anchor.addEventListener('mouseenter',()=>{if(anchor.classList.contains('phase-rest'))play('startle');});
</script></html>
